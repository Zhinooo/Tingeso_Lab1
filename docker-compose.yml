services:
  db:
    image: mysql:8.4
    container_name: siga-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PSW}
      MYSQL_DATABASE: ${DB_NAME:-tingeso1}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PSW}
    ports:
      - "${DB_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: siga-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PSW:-admin}
      SIGA_BACKEND_CLIENT_SECRET: ${SIGA_BACKEND_CLIENT_SECRET:-siga-backend-dev-secret}
      SIGA_TEST_USER_PASSWORD: ${SIGA_TEST_USER_PASSWORD:?SIGA_TEST_USER_PASSWORD is required}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:Z
      - keycloak-data:/opt/keycloak/data/h2

  backend:
    build: ./backend
    image: siga-backend:local
    container_name: siga-backend
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-tingeso1}
      DB_USER: ${DB_USER}
      DB_PSW: ${DB_PSW}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/siga
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${SIGA_BACKEND_CLIENT_SECRET:-siga-backend-dev-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_DATA: ${SEED_DATA:-false}
    ports:
      - "${BACKEND_PUBLISHED_PORT:-8090}:8090"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8090}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    image: siga-frontend:local
    container_name: siga-frontend
    profiles: ["frontend"]
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-5173}:80"

volumes:
  db-data:
  keycloak-data:
