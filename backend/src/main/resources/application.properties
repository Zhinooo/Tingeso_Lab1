server.port=8090
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:tingeso1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PSW}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/siga}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/siga}/protocol/openid-connect/certs}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
keycloak.admin.enabled=${KEYCLOAK_ADMIN_ENABLED:true}
keycloak.admin.base-url=${KEYCLOAK_ADMIN_URL:http://localhost:8180}
keycloak.admin.realm=${KEYCLOAK_REALM:siga}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:siga-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
