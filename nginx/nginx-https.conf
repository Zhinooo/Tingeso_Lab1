upstream backend {
    server backend-1:8090;
    server backend-2:8090;
    server backend-3:8090;
}

log_format balanced '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/siga/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siga/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log balanced;

    include /etc/nginx/siga/locations.conf;
}
