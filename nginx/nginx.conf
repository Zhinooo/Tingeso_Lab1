upstream backend {
    server backend-1:8090;
    server backend-2:8090;
    server backend-3:8090;
}

log_format balanced '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log balanced;

    include /etc/nginx/siga/locations.conf;
}
