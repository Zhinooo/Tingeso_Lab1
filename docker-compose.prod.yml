name: siga-prod

x-backend: &backend
  image: ${BACKEND_IMAGE:-siga-backend:prod}
  build: ./backend
  restart: unless-stopped
  depends_on: &backend-depends
    db:
      condition: service_healthy
    keycloak:
      condition: service_started
  environment: &backend-env
    DB_HOST: db
    DB_NAME: ${DB_NAME:-tingeso1}
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PSW: ${DB_PSW:?DB_PSW is required}
    KEYCLOAK_ISSUER_URI: ${PUBLIC_URL:-http://localhost}/auth/realms/siga
    KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/siga/protocol/openid-connect/certs
    KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
    KEYCLOAK_ADMIN_CLIENT_SECRET: ${SIGA_BACKEND_CLIENT_SECRET:?SIGA_BACKEND_CLIENT_SECRET is required}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
    SEED_DATA: "false"
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8090/v3/api-docs > /dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PSW:?DB_ROOT_PSW is required}
      MYSQL_DATABASE: ${DB_NAME:-tingeso1}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PSW:?DB_PSW is required}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?KC_ADMIN_USER is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PSW:?KC_ADMIN_PSW is required}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost}/auth
      KC_PROXY_HEADERS: xforwarded
      SIGA_BACKEND_CLIENT_SECRET: ${SIGA_BACKEND_CLIENT_SECRET:?SIGA_BACKEND_CLIENT_SECRET is required}
      SIGA_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:Z
      - keycloak-data:/opt/keycloak/data/h2

  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_DATA: ${SEED_DATA:-false}

  backend-2:
    <<: *backend
    depends_on:
      <<: *backend-depends
      backend-1:
        condition: service_healthy

  backend-3:
    <<: *backend
    depends_on:
      <<: *backend-depends
      backend-1:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-siga-frontend:prod}
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
      keycloak:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    ports:
      - "${PUBLIC_PORT:-80}:80"

volumes:
  db-data:
  keycloak-data:
